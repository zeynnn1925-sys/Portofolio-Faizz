<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Paper Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#242B38" stroke-width="1" opacity="0.02" />
    </pattern>
    <!-- Clay Shadow Filter -->
    <filter id="clay-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="12" stdDeviation="16" flood-color="#242B38" flood-opacity="0.12" />
      <feDropShadow dx="-12" dy="-12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.9" />
    </filter>
    <filter id="stamp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="10" flood-color="#242B38" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Bone White -->
  <rect width="1200" height="630" fill="#F3EFE7" />
  
  <!-- Grid Pattern Overlay -->
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <!-- Top and Bottom Decorative Lines (Folder / Dossier motif) -->
  <line x1="0" y1="20" x2="1200" y2="20" stroke="#2F5D5A" stroke-width="4" stroke-dasharray="16 12" opacity="0.4" />
  <line x1="0" y1="610" x2="1200" y2="610" stroke="#2F5D5A" stroke-width="4" stroke-dasharray="16 12" opacity="0.4" />

  <!-- LEFT CONTENT GROUP -->
  <g transform="translate(100, 130)">
    
    <!-- Chip tag "REC-04" -->
    <g transform="translate(0, 0)">
      <!-- Outer clay shadow/border -->
      <rect width="110" height="32" rx="10" fill="#FFFDF8" stroke="rgba(36, 43, 56, 0.1)" stroke-width="1" />
      <circle cx="20" cy="16" r="4" fill="#E8A855" />
      <text x="36" y="21" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="800" fill="#242B38" letter-spacing="1">REC-04</text>
    </g>

    <!-- Main Name Heading -->
    <text x="0" y="110" font-family="'Fraunces', 'Georgia', serif" font-size="72" font-weight="500" fill="#242B38" letter-spacing="-1">Muhammad</text>
    <text x="0" y="190" font-family="'Fraunces', 'Georgia', serif" font-size="72" font-style="italic" font-weight="700" fill="#C7862F" letter-spacing="-0.5">Faiz Dzahin</text>

    <!-- Subtitle Role -->
    <text x="0" y="250" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" font-weight="700" fill="#2F5D5A" letter-spacing="4">ADMINISTRATIVE &amp; SYSTEMS SPECIALIST</text>

    <!-- Additional Detail/Quote -->
    <text x="0" y="300" font-family="'Quicksand', 'Arial', sans-serif" font-size="16" font-weight="500" fill="#62697A" opacity="0.9">
      Pengolah pangkalan data dengan integritas administratif teruji.
    </text>
    <text x="0" y="325" font-family="'Quicksand', 'Arial', sans-serif" font-size="16" font-weight="500" fill="#62697A" opacity="0.9">
      Menggabungkan ketelitian tata buku dengan sistem informasi web.
    </text>
  </g>

  <!-- RIGHT CONTENT GROUP (Claymorphic / Circular Stamp) -->
  <g transform="translate(900, 315)">
    <!-- Outer stamp background circle with clay-shadow filter -->
    <circle cx="0" cy="0" r="180" fill="#FFFDF8" filter="url(#clay-shadow)" stroke="rgba(255,255,255,0.8)" stroke-width="2" />
    
    <!-- Outer stempel decoration (Teal stamp) -->
    <circle cx="0" cy="0" r="140" fill="#2F5D5A" filter="url(#stamp-shadow)" />
    <!-- Outer stamp dashed line -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#FFFDF8" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85" />
    <!-- Inner stamp solid line -->
    <circle cx="0" cy="0" r="114" fill="none" stroke="#FFFDF8" stroke-width="1.5" opacity="0.8" />
    
    <!-- Central Text in Stamp -->
    <text x="0" y="42" font-family="'Fraunces', 'Georgia', serif" font-size="124" font-weight="700" fill="#FFFDF8" text-anchor="middle">F</text>
    
    <!-- Stamp Circular Details -->
    <path id="textPathTop" d="M -90,-20 A 92,92 0 0,1 90,-20" fill="none" stroke="none" />
    <path id="textPathBottom" d="M -90,20 A 92,92 0 0,0 90,20" fill="none" stroke="none" />
    
    <!-- Top circular text -->
    <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10" font-weight="700" fill="#FFFDF8" letter-spacing="4" text-anchor="middle">
      <textPath href="#textPathTop" startOffset="50%">VERIFIED RECORD</textPath>
    </text>
    <!-- Bottom circular text -->
    <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10" font-weight="700" fill="#FFFDF8" letter-spacing="4" text-anchor="middle">
      <textPath href="#textPathBottom" startOffset="50%">PORTFOLIO DOKUMEN</textPath>
    </text>
  </g>
</svg>
